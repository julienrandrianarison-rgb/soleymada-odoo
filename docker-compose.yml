services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  odoo:
    image: odoo:${ODOO_VERSION}
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8069:8069"
    env_file: .env
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD}
      SCRIPTS_DIR: /mnt/scripts
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      - ./scripts:/mnt/scripts
      - ./backups:/mnt/backups

volumes:
  pgdata:
  odoo-data:
